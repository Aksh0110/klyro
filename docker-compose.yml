version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: klyro-mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: klyro
    volumes:
      - mongodb_data:/data/db
    networks:
      - klyro-network

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: klyro-api
    restart: always
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      API_PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/klyro
      JWT_SECRET: super_secret_klyro_jwt_key_dev_mode_only_123456789
      JWT_REFRESH_SECRET: super_secret_klyro_jwt_refresh_key_dev_mode_only_987654321
      DEV_OTP_ENABLED: 'true'
      DEFAULT_DEV_OTP: '123456'
      CORS_ORIGIN: https://klyro.gymbook.ai
    depends_on:
      - mongodb
    networks:
      - klyro-network

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://klyrobackend.gymbook.ai/api/v1
    container_name: klyro-web
    restart: always
    ports:
      - '3001:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://klyrobackend.gymbook.ai/api/v1
    depends_on:
      - api
    networks:
      - klyro-network

networks:
  klyro-network:
    driver: bridge

volumes:
  mongodb_data:

